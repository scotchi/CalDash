name: CalDash
options:
  bundleIdPrefix: net.scotchi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  CalDashKit:
    path: CalDashKit

targets:
  CalDash:
    type: application
    platform: macOS
    sources:
      - path: CalDash
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scotchi.CalDash
        INFOPLIST_FILE: CalDash/Info.plist
        CODE_SIGN_ENTITLEMENTS: CalDash/CalDash.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: CalDashKit
      - target: CalDashWidget
        embed: true
        codeSign: true

  CalDashWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: CalDashWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scotchi.CalDash.Widget
        INFOPLIST_FILE: CalDashWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CalDashWidget/CalDashWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: CalDashKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
